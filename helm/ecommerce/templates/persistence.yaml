{{- $existingPvc := lookup "v1" "PersistentVolumeClaim" .Values.namespace "mysql-pvc" -}}
{{- if and .Values.persistence.enabled (not $existingPvc) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
{{ toYaml .Values.persistence.accessModes | indent 4 }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
