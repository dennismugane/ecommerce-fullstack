{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.secrets.data.MYSQL_ROOT_PASSWORD | quote }}
  MYSQL_PASSWORD: {{ .Values.secrets.data.MYSQL_PASSWORD | quote }}
  MYSQL_USER: {{ .Values.secrets.data.MYSQL_USER | quote }}
  MYSQL_DATABASE: {{ .Values.secrets.data.MYSQL_DATABASE | quote }}
  JWT_SECRET: {{ .Values.secrets.data.JWT_SECRET | quote }}
{{- end }}
