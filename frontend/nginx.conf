server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # Backend routing is handled by the cluster Ingress at /api
    # The frontend should use relative paths (e.g. /api/...) so Ingress routes requests to the backend.
  }
}