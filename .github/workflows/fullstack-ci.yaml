name: CI/CD — Full Stack Build & Deploy

on:
  push:
    branches:
      - "main" # Change this to your production branch (e.g., main or master)
  workflow_dispatch:

jobs:
  backend:
    name: Backend — Spring Boot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build with Maven
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:h2:mem:testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: mydummysecretkeythatisatleast32characterslong12345
          APP_CORS_ALLOWED-ORIGINS: http://localhost:3000
        run: mvn clean install --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/target/*.jar
          retention-days: 7

  # ── Job 2: Security Scan ────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: backend
    env:
      IMAGE_NAME: ecommerce-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify dependency versions
        working-directory: ./backend
        run: |
          # grep returns exit code 1 when no matches found — prevent failure
          mvn dependency:tree -q | grep -E "tomcat|spring-security|spring-core|spring-web" || true
          echo "Dependency check complete"

      # SAST: scan source code for vulnerabilities
      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten
        continue-on-error: true # Don't fail the pipeline on first run

      # Build the image locally for scanning — don't push until it's clean
      - name: Build Docker image for scanning
        run: docker build -t ${{ env.IMAGE_NAME }}:scan ./backend

      # Container image scan: check for known CVEs in base image and dependencies
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: "1" # Fail the pipeline on HIGH/CRITICAL CVEs
          severity: HIGH,CRITICAL
          ignore-unfixed: true # Don't fail on CVEs with no fix available

  frontend:
    name: Frontend — React
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npx vitest run --reporter=verbose

      # Inject your CloudFront Backend API URL so React compiles it into the bundle
      - name: Build Production Bundle
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: "https://d2fxqzyyexmaqr.cloudfront.net" # Your backend_cloudfront_url
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  deploy-frontend:
    name: Deploy Frontend — AWS S3 & CloudFront
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./dist

      # Configure pipeline authentication using secrets securely stored on GitHub
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Sync files directly into the frontend S3 bucket
      - name: Deploy to S3 Bucket
        run: |
          aws s3 sync ./dist s3://my-ecommerce-frontend-prod-2026 --delete

      # Instantly break the negative 403/404 cache on CloudFront edge locations
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E4Q94M1Q6U5TZ --paths "/*"
