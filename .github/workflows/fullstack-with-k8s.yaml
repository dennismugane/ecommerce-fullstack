name: CI/CD — Full Stack Build & Deploy

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  # ── Job 1: Backend Build ────────────────────────────────────────────────────
  backend:
    name: Backend — Spring Boot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build with Maven
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:h2:mem:testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: mydummysecretkeythatisatleast32characterslong12345
          APP_CORS_ALLOWED-ORIGINS: http://localhost:3000
        run: mvn clean install --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: backend/target/*.jar
          retention-days: 7

  # ── Job 2: Security Scan ────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: backend
    env:
      IMAGE_NAME: ecommerce-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify dependency versions
        working-directory: ./backend
        run: |
          mvn dependency:tree -q | grep -E "tomcat|spring-security|spring-core|spring-web" || true
          echo "Dependency check complete"

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten
        continue-on-error: true

      - name: Build Docker image for scanning
        run: docker build -t ${{ env.IMAGE_NAME }}:scan ./backend

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ── Job 3: Docker Build & Push to Docker Hub ────────────────────────────────
  docker-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: security-scan        # only push if security scan passes
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/ecommerce-backend:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/ecommerce-backend:latest
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/ecommerce-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/ecommerce-frontend:latest

  # ── Job 4: Frontend Build ───────────────────────────────────────────────────
  frontend:
    name: Frontend — React
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npx vitest run --reporter=verbose

      - name: Build Production Bundle
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.BACKEND_CLOUDFRONT_URL }}   # store in GitHub secrets
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

  
  # ── Job 5: Deploy Backend & Frontend → EKS ────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend — EKS
    runs-on: ubuntu-latest
    needs: docker-push           # wait for new image to be pushed
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name muigo-eks-prod

      - name: Install NGINX ingress controller
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx \
            --create-namespace \
            --set controller.replicaCount=2 \
            --set controller.nodeSelector."kubernetes\.io/os"=linux \
            --wait --timeout 10m

      - name: Verify ingress controller is running
        run: |
          kubectl wait --namespace ingress-nginx \
            --for=condition=Available deployment/ingress-nginx-controller \
            --timeout=600s
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod -l app.kubernetes.io/component=controller \
            --timeout=600s
          kubectl get pods -n ingress-nginx
          kubectl get svc -n ingress-nginx

      - name: Ensure namespace and manifests exist
        run: |
          set -e
          kubectl create namespace ecommerce --dry-run=client -o yaml | kubectl apply -f -

          if helm status ecommerce -n ecommerce >/tmp/helm-status.txt 2>&1; then
            if grep -Eq "STATUS: pending-install|STATUS: pending-upgrade|STATUS: pending-rollback" /tmp/helm-status.txt; then
              echo "Found a stuck Helm release. Cleaning up previous operation..."
              helm uninstall ecommerce -n ecommerce --wait --timeout 5m --ignore-not-found || true
              kubectl delete secret -n ecommerce sh.helm.release.v1.ecommerce.v1 --ignore-not-found || true
            fi
          fi

          if ! helm upgrade --install ecommerce ./helm/ecommerce \
            --namespace ecommerce \
            --create-namespace \
            --set persistence.enabled=false \
            --set backend.image.repository=${{ secrets.DOCKER_HUB_USERNAME }}/ecommerce-backend \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository=${{ secrets.DOCKER_HUB_USERNAME }}/ecommerce-frontend \
            --set frontend.image.tag=${{ github.sha }} \
            --wait --timeout 15m --debug --atomic; then
              echo "Helm install/upgrade failed. Gathering diagnostics..."
              echo "--- Helm release status ---"
              helm status ecommerce -n ecommerce || true
              echo "--- Helm history ---"
              helm history ecommerce -n ecommerce || true
              echo "--- Pods ---"
              kubectl get pods -n ecommerce || true
              echo "--- Pod descriptions ---"
              kubectl describe pods -n ecommerce || true
              echo "--- Events ---"
              kubectl get events -n ecommerce --sort-by=.metadata.creationTimestamp || true
              echo "--- Rendered manifest ---"
              helm template ecommerce ./helm/ecommerce -n ecommerce || true
              exit 1
          fi

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/ecommerce-backend \
            -n ecommerce \
            --timeout=300s

      - name: Verify frontend rollout
        run: |
          # Wait for frontend deployment (if present) to become ready
          kubectl rollout status deployment/ecommerce-frontend -n ecommerce --timeout=180s || true

      - name: Verify pods are running
        run: |
          kubectl get pods -n ecommerce

      - name: Print the website URL
        run: |
          export INGRESS=$(kubectl get svc ingress-nginx-controller \
            -n ingress-nginx \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo http://$INGRESS